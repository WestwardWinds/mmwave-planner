    <title>mmWave Coverage Planner</title>
    <meta name="description" content="Plan mmWave presence sensor placement in 3D: coverage cones, overlap between sensors, pitched ceilings and dead spots behind furniture." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

      body { background: #eef1f5; }
      @media (prefers-color-scheme: dark) { body { background: #0e1217; } }

      mmwave-planner { --mmwave-height: 100dvh; }
